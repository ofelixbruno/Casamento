<style>
:root { color-scheme: light; }
:root {
  --bg: #F9F3EA;
  --surface: #FFFBF5;
  --ink: #492E2E;
  --muted: #76605C;
  --line: #E6D8C3;
  --accent: #CEA666;
  --accent-ink: #492E2E;
  --accent-text: #9A6F2E;
  --wa: #8B6330;
  --wa-ink: #FFFFFF;
  --flag3: #8B6330;
  --display: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --script: "Great Vibes", "Brush Script MT", cursive;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #231616;
    --surface: #2F1F1F;
    --ink: #F5EBDD;
    --muted: #C7B3A6;
    --line: #4A3434;
    --accent: #CEA666;
    --accent-ink: #2A1A12;
    --accent-text: #E0BB7A;
    --wa: #E0BB7A;
    --wa-ink: #2A1A12;
    --flag3: #A97C37;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--display);
  font-size: 18px;
  line-height: 1.5;
  font-weight: 500;
}
h1, p { margin: 0; }
:focus-visible { outline: 3px solid var(--flag3); outline-offset: 3px; }

.page {
  width: min(100%, 420px);
  padding: 48px max(28px, env(safe-area-inset-right, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)) max(28px, env(safe-area-inset-left, 0px));
  text-align: center;
}

.date {
  font-size: clamp(1.05rem, 4vw, 1.3rem);
  font-weight: 500;
  letter-spacing: .28em;
  padding-left: .28em;
  color: var(--muted);
}
h1 {
  margin-top: 10px;
  font-family: var(--script);
  font-weight: 400;
  font-size: clamp(3.6rem, 18vw, 5rem);
  line-height: 1.1;
  color: var(--ink);
}
h1 span { color: var(--accent-text); }
.rule { width: 56px; height: 2px; margin: 20px auto 0; background: var(--accent); }

.links { display: grid; gap: 12px; margin-top: 40px; }
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 56px;
  padding: 0 20px;
  border-radius: 4px;
  border: 2px solid var(--accent);
  background: var(--accent);
  color: var(--accent-ink);
  font-family: var(--display);
  font-size: 1.2rem;
  font-weight: 700;
  letter-spacing: .02em;
  text-decoration: none;
  transition: transform .15s ease, filter .15s ease;
}
.btn svg { width: 21px; height: 21px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.btn:hover { filter: brightness(.96); }
.btn:active { transform: scale(.98); }
.btn.wa { background: var(--wa); color: var(--wa-ink); border-color: var(--wa); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }

@media (prefers-reduced-motion: no-preference) {
  .page > * { animation: rise .6s cubic-bezier(.2, .7, .2, 1) both; }
  .page > :nth-child(2) { animation-delay: .06s; }
  .page > :nth-child(3) { animation-delay: .12s; }
  .page > :nth-child(4) { animation-delay: .2s; }
}
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<main class="page">

      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></svg>
      Confirmar presença
    </a>

    </a>
  </nav>
</main>
</body>
</html>
